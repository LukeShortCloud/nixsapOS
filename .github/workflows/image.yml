name: Image
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  build:
    name: Build the ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    strategy:
      # One at a time, so that act's two build containers never share the nixsapos-nix volume at once.
      max-parallel: 1
      matrix:
        include:
          - image: nixsapos
            package: nixsapos-build
          - image: nixsapos-encrypted
            package: nixsapos-build-encrypted
    steps:
      # The build needs over 20 GB.
      - name: Free disk space
        # Skip this when testing locally with act, which sets ACT and mounts its own tool cache.
        if: ${{ !env.ACT }}
        run: |
          df -h /
          sudo rm -rf /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same commands as a local build with Docker (see CONTRIBUTING.md).
      - name: Create the builder container image
        run: docker build -t nixsapos-builder -f build/Containerfile build/
      # Outside the repository, like a local build. With act's --bind, this is next to the repository on the host.
      - name: Choose the output directory
        run: echo "NIXSAPOS_OUTPUT=$(dirname "${GITHUB_WORKSPACE}")/nixsapos-output" >> "${GITHUB_ENV}"
      - name: Build the image
        run: docker run --rm --privileged -v /dev:/dev -v nixsapos-nix:/nix -v "${GITHUB_WORKSPACE}":/workdir -w /workdir -v "${NIXSAPOS_OUTPUT}":/output -e NIXSAPOS_OUTPUT_DIR=/output nixsapos-builder nix run .#${{ matrix.package }}
      # List it from a container, because act's own container only sees the repository.
      - name: Show the image
        run: docker run --rm -v "${NIXSAPOS_OUTPUT}":/output nixsapos-builder ls -lh /output
